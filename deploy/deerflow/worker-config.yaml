# The SDK imports its skill loader during startup. Its catalog lives in the
# worker's empty temporary home. CareOps supplies only reviewed skill text.
models:
  - name: scoped-read
    model: scoped-read
    use: delegation:EvidenceTransport
tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
    region: cn-zh
  - name: read_assigned_evidence
    group: institution-evidence
    use: delegation:read_assigned_evidence
tool_groups:
  - name: institution-evidence
subagents:
  custom_agents:
    care: &evidence_agent
      description: 核对本次授权的护理资料
      system_prompt: 只核对本次分配给本岗位的院内资料。
      tools: [read_assigned_evidence]
      skills: []
      model: scoped-read
      max_turns: 3
      timeout_seconds: 90
    inventory:
      <<: *evidence_agent
      description: 核对本次授权的库存资料
    finance:
      <<: *evidence_agent
      description: 核对本次授权的财务资料
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
memory:
  enabled: false
skill_evolution:
  enabled: false
