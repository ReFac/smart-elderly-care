<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>助理流式答复和朗读回归</title>
<link rel="stylesheet" href="../../web/style.css">
<link rel="stylesheet" href="../../web/agents.css">
<body>
<output role="status">运行中</output>
<script type="module">
  import { chatLauncher, openChat, clearChat } from '../../web/features/assistant-chat.js';

  const container = '/api/assistant/chat';
  const region = { roomId: 'fixture-room' };
  const scopeKey = 'fixture-room-scope';
  const generation = 'fixture-thread';
  const state = {
    user: { id: 'stream-fixture', kind: 'staff', permissions: ['assistants'], routes: ['overview'] },
    uiSettings: { institutionName: '演示机构', hiddenRoutes: [] },
    assistantVoice: {state: 'available', path: '/api/assistant/voice'},
  };
  const ctx = {
    state, available: () => true, async checkNavigation() { return true; },
    go(route, _tab, onArrival) {
      history.pushState(null, '', '#' + route);
      onArrival?.();
    },
  };
  const find = selector => document.querySelector(selector);
  const first = '这是可以立即显示并朗读的第一句。';
  const last = '这是推迟到结束前才返回的收尾。';
  const encoder = new TextEncoder();
  const turns = [];
  const calls = [];
  const messages = [];
  const voiceReceipts = [];
  let transcript = '';

  function check(condition, message) {
    if (!condition) throw new Error(message);
  }
  async function until(test, message) {
    const deadline = performance.now() + 5000;
    while (!test() && performance.now() < deadline) await new Promise(resolve => setTimeout(resolve, 12));
    check(test(), message);
  }
  function wave() {
    const bytes = new ArrayBuffer(32044);
    const view = new DataView(bytes);
    const words = {0: 'RIFF', 8: 'WAVE', 12: 'fmt ', 36: 'data'};
    for (const [offset, label] of Object.entries(words))
      [...label].forEach((letter, i) => view.setUint8(Number(offset) + i, letter.charCodeAt(0)));
    const counters = {4: 32036, 16: 16, 24: 8000, 28: 16000, 40: 32000};
    for (const [offset, value] of Object.entries(counters)) view.setUint32(Number(offset), value, true);
    for (const [offset, value] of [[20, 1], [22, 1], [32, 2], [34, 16]]) view.setUint16(offset, value, true);
    return new Response(bytes, {headers: {'Content-Type': 'audio/wav'}});
  }
  function abortable(signal, action) {
    return new Promise((resolve, reject) => {
      signal.addEventListener('abort', () => reject(signal.reason), {once: true});
      action(resolve);
    });
  }
  function frame(turn, event, splitAt = 0) {
    const bytes = encoder.encode(JSON.stringify(event) + '\n');
    if (splitAt) {
      turn.controller.enqueue(bytes.slice(0, splitAt));
      turn.controller.enqueue(bytes.slice(splitAt));
    } else turn.controller.enqueue(bytes);
  }
  function finalize(turn) {
    turn.done = true;
    messages.push({role: 'user', content: turn.payload.text},
      {role: 'assistant', content: first + last, requestId: turn.payload.requestId});
    return {scopeKey, generation, messages: [...messages]};
  }
  function finish(turn) {
    frame(turn, {type: 'text', text: last});
    frame(turn, {type: 'done', result: finalize(turn)});
    turn.controller.close();
  }
  window.fetch = async (path, options = {}) => {
    if (path === container + '?roomId=fixture-room') {
      return Response.json({scopeKey, generation, messages: [...messages]});
    }
    if (path === '/api/assistant/voice?roomId=fixture-room') {
      const receipt = crypto.randomUUID().replaceAll('-', '');
      voiceReceipts.push(receipt);
      return Response.json({text: transcript, transcriptId: receipt});
    }
    if (path === container + '/stream') {
      const payload = JSON.parse(options.body);
      check(options.headers.Accept === 'application/x-ndjson', '使用流式答复接口');
      if (payload.voiceTranscriptId || payload.readAloud)
        check(payload.voiceTranscriptId === voiceReceipts.at(-1), '语音消息提交本次转写凭证');
      const turn = {payload, signal: options.signal, done: false};
      turns.push(turn);
      if (payload.text === '兼容完整答复') return Response.json(finalize(turn));
      const stream = new ReadableStream({
        start(controller) {
          turn.controller = controller;
          frame(turn, {type: 'begin', scopeKey, generation, requestId: payload.requestId,
            ...(payload.text === '打开运营总览' ? { action: { kind: 'navigate', route: 'overview', title: '运营总览' } } : {}),
          });
          options.signal.addEventListener('abort', () => {
            if (!turn.done) controller.error(options.signal.reason);
          }, {once: true});
        },
      });
      return new Response(stream, {headers: {'Content-Type': 'application/x-ndjson; charset=utf-8'}});
    }
    check(path === container + '/speech', '朗读仅使用机构同源接口');
    const payload = JSON.parse(options.body);
    const turn = turns.find(item => item.payload.requestId === payload.requestId);
    const key = Object.hasOwn(payload, 'sentence') ? 'sentence' : 'part';
    check(turn && Object.keys(payload).sort().join(',') ===
      ['region', 'scopeKey', 'generation', 'requestId', key].sort().join(','), '朗读请求只有会话定位字段');
    check(payload.scopeKey === scopeKey && payload.generation === generation &&
      payload.region.roomId === region.roomId && payload[key] === 0, '朗读定位到已授权房间对话的首段');
    const call = {turn, payload, beforeDone: !turn.done, signal: options.signal};
    calls.push(call);
    return abortable(options.signal, resolve => { call.deliver = () => resolve(wave()); });
  };
  const open = () => openChat(() => ctx, {...region, label: '演示房间'});
  const launch = chatLauncher(open);
  document.body.append(launch);
  const log = () => find('.assistant-log');
  const input = () => find('.assistant-input');
  const panel = () => find('#assistant-chat');
  const popup = () => find('.assistant-reader');
  function ping(question) {
    input().value = question;
    input().dispatchEvent(new Event('input'));
    input().form.requestSubmit();
    return turns.at(-1);
  }
  function beginSpeech(turn) {
    frame(turn, {type: 'text', text: first}, 24);
    frame(turn, {type: 'speech', sentence: 0});
  }
  async function speak(question) {
    transcript = question;
    const mic = find('.assistant-hold');
    const hold = (type) => mic.dispatchEvent(new KeyboardEvent(type, {key: ' ', bubbles: true}));
    hold('keydown');
    await until(() => mic.dataset.phase === 'recording', '按住说话开启录音');
    check(!find('.assistant-read-option input').disabled, '录音时可以设置朗读');
    await new Promise(resolve => setTimeout(resolve, 230));
    hold('keyup');
    await until(() => mic.dataset.phase === 'idle', '松开完成转写');
  }
  async function run() {
    const audioContext = new AudioContext();
    const oscillator = audioContext.createOscillator();
    const destination = audioContext.createMediaStreamDestination();
    oscillator.connect(destination);
    oscillator.start();
    Object.defineProperty(navigator.mediaDevices, 'getUserMedia', {configurable: true,
      value: async () => destination.stream.clone()});
    launch.click();
    await until(() => input() && !input().disabled, '打开健康助理');
    const checkSpeech = find('.assistant-read-option input');
    check(!checkSpeech.disabled && !checkSpeech.checked, '语音朗读默认关闭，可在录音前勾选');
    const typed = ping('普通文字答复');
    check(!typed.payload.readAloud && !typed.payload.voiceTranscriptId, '普通文字请求关闭朗读，不关联语音回执');
    beginSpeech(typed);
    finish(typed);
    await until(() => !input().readOnly, '文字请求完成');
    check(!calls.length && popup().hidden, '文字消息不发起朗读');

    await speak('不用朗读也关联转写');
    const silent = turns.at(-1);
    check(!silent.payload.readAloud && silent.payload.voiceTranscriptId === voiceReceipts.at(-1),
      '关闭朗读仍提交本次转写凭证');
    finish(silent);
    await until(() => !input().readOnly, '关闭朗读的语音消息已完成');
    check(!calls.length && popup().hidden, '转写凭证不会启用朗读');

    checkSpeech.closest('label').click();
    check(checkSpeech.checked, '点击朗读标签可在按住说话前开启朗读');
    await speak('分段返回');
    const streaming = turns.at(-1);
    check(streaming.payload.text === '分段返回' && streaming.payload.readAloud && checkSpeech.checked,
      '松开时自动发送，保留朗读勾选');
    beginSpeech(streaming);
    await until(() => calls.length === 1, '回复仍在生成时已请求朗读');
    const current = () => log().querySelector('.assistant-current');
    await until(() => current()?.innerText.includes(first), '回复仍在生成时已展示首段文字');
    check(calls[0].beforeDone && !current().innerText.includes(last), '首段文字展示，整条答复尚未结束');
    calls[0].deliver();
    await until(() => popup().dataset.playback === 'playing', '首段音频并行播放');
    check(!popup().hidden && popup().querySelector('.assistant-reader-wave').children.length > 3 &&
      !find('audio').controls && !popup().querySelector('progress,input[type=range]'), '声纹窗口替换原生进度条');
    const toggle = popup().querySelector('.assistant-reader-toggle');
    check([...popup().querySelectorAll('button')].map(b => b.textContent).join(' ') === '暂停 退出', '朗读浮窗仅有暂停和退出');
    toggle.click();
    await until(() => find('audio').paused && toggle.textContent === '继续', '暂停朗读');
    toggle.click();
    await until(() => !find('audio').paused && toggle.textContent === '暂停', '继续朗读');
    check(!streaming.done, '播放区显示时未收到完整答复');
    popup().querySelector('.assistant-reader-close').click();
    check(popup().hidden && !find('audio').getAttribute('src'), '退出清除播放器');
    frame(streaming, {type: 'speech', sentence: 1});
    finish(streaming);
    await until(() => !input().readOnly && log().innerText.includes(last), '写回完整答复');
    check(!log().querySelector('.assistant-current') && calls.length === 1, '退出后同一回复不会再次朗读');

    input().value = '下一条键盘问题';
    input().dispatchEvent(new Event('input'));
    check(checkSpeech.checked && checkSpeech.disabled, '输入文字时保留语音偏好，禁用朗读设置');
    const typedAfterSpeech = ping(input().value);
    check(!typedAfterSpeech.payload.readAloud && checkSpeech.disabled, '打开过朗读的语音设置不会带到文字问题');
    finish(typedAfterSpeech);
    await until(() => !input().readOnly, '下一条键盘问题完成');

    check(checkSpeech.checked && !checkSpeech.disabled, '空白输入恢复朗读选项，自动发送前能确认选中');
    await speak('在收起前开始朗读');
    await until(() => turns.at(-1).payload.text === '在收起前开始朗读', '自动发送转写');
    const folded = turns.at(-1);
    check(folded.payload.readAloud, '自动发送提问沿用语音朗读设置');
    beginSpeech(folded);
    await until(() => calls.length === 2, '第二轮开始朗读');
    find('button[aria-label=收起助理]').click();
    await until(() => calls[1].signal.aborted && panel().hidden, '收起停止正在请求的音频');
    check(popup().hidden && !find('audio').getAttribute('src'), '收起清除播放器');
    frame(folded, {type: 'speech', sentence: 1});
    finish(folded);
    await until(() => !input().readOnly, '收起后完整答复仍写回');
    check(calls.length === 2, '收起后不再请求后续片段');

    launch.click();
    await until(() => !input().disabled, '重开同一对话');
    await speak('兼容完整答复');
    await until(() => calls.length === 3 && !input().readOnly, '完整 JSON 答复可使用兼容朗读');
    check(calls[2].payload.part === 0 && !calls[2].beforeDone, '完整 JSON 回复仍从已保存文本读取');
    calls[2].deliver();
    await until(() => !popup().hidden, '已保存答复打开朗读小窗');

    await speak('打开运营总览');
    check(calls[2].signal.aborted, '开启新录音时打断上一轮朗读，避免收进录音');
    const navigated = turns.at(-1);
    await until(() => panel().querySelector('.assistant-current .assistant-page-link'), '流式回复先给出可点击的入口');
    check(location.hash !== '#overview' && !panel().hidden, '未点击时不跳转');
    panel().querySelector('.assistant-current .assistant-page-link').click();
    await until(() => location.hash === '#overview' && panel().classList.contains('assistant-compact'), '点击入口后小窗随行');
    beginSpeech(navigated);
    await until(() => calls.length === 4 && !navigated.done, '切到业务页后仍并行朗读');
    calls[3].deliver();
    await until(() => !popup().hidden && popup().getBoundingClientRect().width > 0, '跳转后继续用声纹小窗');
    popup().querySelector('.assistant-reader-close').click();
    finish(navigated);
    await until(() => !input().readOnly, '跳转后的完整答复仍写回');
    launch.click();
    await until(() => !input().disabled, '重开对话可发送下一条消息');
    await speak('销毁期间的对话');
    const discarded = turns.at(-1);
    beginSpeech(discarded);
    await until(() => calls.length === 5, '等待一段可中止的朗读');
    clearChat();
    check(!panel() && discarded.signal.aborted && calls[4].signal.aborted, '销毁助理时中止接收及朗读');
    launch.click();
    await until(() => !input().disabled, '再次打开健康助理');
    check(!find('.assistant-read-option input').checked, '新面板默认不朗读');
    oscillator.stop();
    await audioContext.close();
    document.documentElement.dataset.result = 'pass';
    find('output').textContent = 'PASS';
  }
  run().catch(error => {
    document.documentElement.dataset.result = 'fail';
    find('output').textContent = error.stack || error.message;
  });
</script>
</body></html>
