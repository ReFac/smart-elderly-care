<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>助理回答中的页面入口回归</title>
<link rel="stylesheet" href="../../web/style.css">
<link rel="stylesheet" href="../../web/agents.css">
<body>
<main id="content" tabindex="-1"></main>
<output role="status">运行中</output>
<script type="module">
  import { chatLauncher, toggleChat, clearChat } from '../../web/features/assistant-chat.js';
  import { assistantCommand, assistantPageLinks, openAssistantAction } from '../../web/features/assistant-actions.js';
  import { renderFeature } from '../../web/features/index.js';
  import { selectTab } from '../../web/features/shared.js';
  import { detail, formDialog } from '../../web/lib/dialogs.js';
  import * as ui from '../../web/lib/ui.js';

  const find = selector => document.querySelector(selector);
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  async function until(test, message) {
    const end = performance.now() + 5000;
    while (!test() && performance.now() < end) await new Promise(resolve => setTimeout(resolve, 12));
    check(test(), message);
  }

  const question = '我该从哪里查看长护险记录？';
  const direct = '打开长期护理保险';
  const destination = { route: 'longCare', title: '长期护理保险' };
  const denied = { route: 'settings', title: '机构设置' };
  const state = {
    user: { id: 'navigation-fixture', kind: 'staff', permissions: ['assistants', 'longCare'], routes: ['longCare'] },
    uiSettings: { institutionName: '演练机构', hiddenRoutes: [] },
    residents: [], longCareEvents: [], allowedActions: [], beds: [], trialSettings: {days:3, fee:null},
  };
  const requests = [], navigations = [], messages = [];
  let freshRoutes = ['longCare'], refreshes = 0, reads = 0, complete;
  const ctx = {
    state, ui, detail, dialog:formDialog, today:'2026-11-25',
    available: route => state.user.routes.includes(route) && !state.uiSettings.hiddenRoutes.includes(route),
    async checkNavigation() {
      refreshes++;
      state.user.routes = [...freshRoutes];
      return true;
    },
    async refreshWorkspace() { throw new Error('导航不应拉取完整工作台'); },
    go(route, tab, onArrival) {
      navigations.push(route);
      if (tab) selectTab(route, tab);
      history.pushState(null, '', '#' + route);
      if (route === 'longCare') find('main').replaceChildren(renderFeature(route, ctx));
      onArrival?.();
    },
    toast() {},
  };
  window.fetch = async (url, options = {}) => {
    if (url === '/api/care/admission/preview') return Response.json({error:'演示预核算不可用'}, {status:503});
    check(url === (options.method === 'POST' ? '/api/assistant/chat/stream' : '/api/assistant/chat'),
      '页面入口只应读取工作台，无需提交院务命令');
    if (options.method === 'POST') {
      const payload = JSON.parse(options.body);
      requests.push(payload);
      messages.push({ role: 'user', content: payload.text, pageLinks: [denied] });
      if (payload.text === direct) {
        const action = { ...destination, kind: 'navigate' };
        const encoder = new TextEncoder();
        const result = new ReadableStream({ start(controller) {
          controller.enqueue(encoder.encode(JSON.stringify({ type: 'begin', action, requestId: payload.requestId }) + '\n'));
          complete = () => {
            messages.push({ role: 'assistant', content: '正在打开长期护理保险。', action, pageLinks: [destination] });
            controller.enqueue(encoder.encode(JSON.stringify({ type: 'done', result: {
              generation: 'fixture-generation', scopeKey: 'fixture-scope', messages,
            } }) + '\n'));
            controller.close();
          };
        } });
        return new Response(result, { headers: { 'Content-Type': 'application/x-ndjson' } });
      } else if (payload.text === '办理正式入住') {
        messages.push({ role:'assistant', content:'请打开入住表单。',
          action:{kind:'openForm', form:'admission', route:'residents', tab:'notAdmitted', title:'办理入住'} });
      } else if (payload.text === question) {
        messages.push({ role: 'assistant', content: '可以进入长期护理保险查看经办台账。',
          pageLinks: [destination, destination, denied, { route: 'https://example.org', title: '不属于工作台' }] });
      } else if (payload.text === '这两个地方分别在哪儿？') {
        messages.push({ role: 'assistant', content: '可以分别进入床位管理和长期护理保险。',
          pageLinks: [{ route: 'beds', tab: 'plan', title: '楼层平面图' }, destination] });
      } else {
        messages.push({ role: 'assistant', content: '这里是公开信息。', webSearched: true,
          sources: [{ title: '公共服务', url: 'https://www.gov.cn/' }], pageLinks: [destination] });
      }
    } else reads++;
    return Response.json({ generation: 'fixture-generation', scopeKey: 'fixture-scope', messages });
  };
  const launcher = chatLauncher(() => toggleChat(() => ctx));
  document.body.append(launcher);
  async function open() {
    const before = reads;
    launcher.click();
    await until(() => reads > before && find('.assistant-input')?.disabled === false, '打开最新的对话');
  }
  async function send(text) {
    const input = find('.assistant-input');
    const before = requests.length;
    submit(text);
    await until(() => requests.length === before + 1 && !input.readOnly && !input.disabled, '完成本轮问答');
  }
  function submit(text) {
    const input = find('.assistant-input');
    input.value = text;
    input.dispatchEvent(new Event('input'));
    input.form.requestSubmit();
  }
  async function run() {
    await open();
    await send(question);
    const entry = find('.assistant-page-link');
    check(entry && entry.textContent.includes('长期护理保险'), '回答应提供名称明确的目标入口');
    check(document.querySelectorAll('.assistant-page-link').length === 1, '入口去重并排除无权限页面、无效路由和用户消息');
    check(!navigations.length && !find('#assistant-chat').hidden, '提供指引时先留在对话');
    entry.focus();
    check(document.activeElement === entry && entry.tabIndex === 0 && entry.matches('button, a[href]'), '入口可用键盘访问');
    entry.click();
    await until(() => location.hash === '#longCare' && find('main').textContent.includes('长护险经办台账'), '进入真实长护险台账');
    check(refreshes === 1 && find('#assistant-chat.assistant-compact:not([hidden])') && !find('dialog[open]'), '点击刷新权限，小窗留在目标页面');

    find('.assistant-expand').click();
    check(!find('.assistant-compact'), '从随行小窗展开对话');
    check(find('.assistant-page-link') && requests.length === 1, '从已保存的回答重新使用入口');
    freshRoutes = [];
    find('.assistant-page-link').click();
    await until(() => refreshes === 2, '点击旧的回答重新校验权限');
    check(navigations.length === 1, '撤销权限后旧入口无法导航');

    clearChat();
    freshRoutes = state.user.routes = ['longCare', 'beds'];
    await open();
    await send('这两个地方分别在哪儿？');
    const choices = [...find('.from-assistant:last-child').querySelectorAll('.assistant-page-link')];
    check(choices.length === 2 && choices[0].textContent.includes('楼层平面图') && choices[1].textContent.includes('长期护理保险'),
      '一条回复可以分别进入两个相关页面');
    await send('请搜索公开政策');
    const lastTurn = find('.from-assistant:last-child');
    check(lastTurn.querySelector('.assistant-source-link') && !lastTurn.querySelector('.assistant-page-link'), '外部资料只展示公开来源');
    check(!document.querySelector('.from-user .assistant-page-link') && !find('dialog[open]'), '点击入口无需执行业务操作');
    const roomEntry = {
      route: 'beds', tab: 'all', title: '查看单人间',
      params: {capacity: '1', limit: '3', floor: 'floor-2', room: '../outside', edit: 'room'},
    };
    const roomLink = assistantPageLinks(ctx, {role: 'assistant', pageLinks: [roomEntry]})[0];
    const expectedParams = JSON.stringify({floor: 'floor-2', capacity: '1', limit: '3'});
    check(JSON.stringify(roomLink.params) === expectedParams, '房型入口保留查阅筛选并清理越界参数与无权编辑项');
    let arrival;
    openAssistantAction({...ctx, go: (route, tab, _focus, params) => { arrival = [route, tab, params]; }},
      {...roomEntry, kind: 'navigate'});
    check(arrival?.[0] === 'beds' && arrival[1] === 'all' &&
      JSON.stringify(arrival[2]) === expectedParams, '点击房型入口带着楼层、房型和数量进入床位列表');
    const selected = assistantCommand(ctx, { role: 'assistant', action: { ...roomEntry, kind: 'navigate' },
      pageLinks: [{ ...roomEntry, params: { ...roomEntry.params, floor: 'floor-8' } }, roomEntry] });
    check(selected.params.floor === 'floor-2', '同一床位页签有多个入口时，保留选定的筛选条件');

    const before = navigations.length;
    history.replaceState(null, '', '#overview');
    submit(direct);
    await until(() => find('.assistant-current .assistant-page-link') && typeof complete === 'function', '云端完整答复之前给出入口');
    check(location.hash === '#overview' && navigations.length === before, '流式开始时留在当前页');
    find('.assistant-current .assistant-page-link').click();
    await until(() => location.hash === '#longCare' && find('.assistant-compact'), '点击早期入口后才进入目标页');
    check(find('.assistant-input').readOnly, '路由跳转与云端答复并行');
    complete();
    await until(() => !find('.assistant-input').readOnly, '云端答复继续完成');
    check(navigations.length === before + 1, '完整答复到达后不会再次打开页面');
    find('.assistant-expand').click();
    freshRoutes = state.user.routes = ['residents'];
    state.allowedActions = ['care.admit'];
    state.residents = [{id:'sample',name:'测试长辈',status:'未入住',level:'自理'}];
    state.beds = [{id:'sample-bed',label:'01-A',ward:'东区',status:'空闲'}];
    await send('办理正式入住');
    check(!find('dialog[open]') && location.hash === '#longCare','打开表单前等待点击');
    find('.from-assistant:last-child .assistant-action').click();
    await until(() => find('dialog[aria-label="选择长辈档案"][open] .assistant-compact'), '小窗进入真实的入住选档模态层');
    const registry = find('.admission-registry');
    [...registry.querySelectorAll('button')].find(b=>b.textContent.trim()==='办理入住').click();
    await until(() => find('dialog[aria-label="从档案办理入住"][open] .assistant-compact'), '选档后随行小窗跟到实际入住表单');
    const activeDialog = find('dialog[aria-label="从档案办理入住"]');
    const expand = activeDialog.querySelector('.assistant-expand');
    const rect = expand.getBoundingClientRect();
    const hit = document.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2);
    check(hit?.closest('button') === expand, '表单遮罩上方可以点中随行小窗 ' + JSON.stringify({
      expand:rect, layer:hit?.className, tag:hit?.tagName, viewport:[innerWidth,innerHeight],
      form:activeDialog.getBoundingClientRect(), floating:activeDialog.querySelector('.assistant-compact').getBoundingClientRect()
    }));
    expand.click();
    const input = activeDialog.querySelector('.assistant-input');
    input.focus();
    check(document.activeElement === input && !find('.assistant-compact'),'表单保持打开时可展开并聚焦输入');
    activeDialog.close();
    clearChat();
    document.documentElement.dataset.result = 'pass';
    find('output').textContent = 'PASS';
  }
  run().catch(error => {
    document.documentElement.dataset.result = 'fail';
    find('output').textContent = error.stack || error.message;
  });
</script>
</body></html>
