# Optional production-like stack. Local MVP defaults to SQLite (no Docker required).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nursing
      POSTGRES_PASSWORD: nursing
      POSTGRES_DB: nursing_home
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
