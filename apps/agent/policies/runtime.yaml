# Harness 运行时策略（可热更新，无需改代码）
version: "2026.11"
fusion:
  sources:
    cv_pose:
      weight: 0.28
      min_confidence: 0.45
      resolution_hint: "480p"
    mmwave_60g:
      weight: 0.32
      min_confidence: 0.40
    acoustic_aed:
      weight: 0.25
      min_confidence: 0.50
      events: ["cough", "wheeze", "impact"]
    call_terminal:
      weight: 0.15
      min_confidence: 0.60
  high_risk_threshold: 0.78
  review_threshold: 0.45
  time_window_seconds: 8
  night_boost:
    enabled: true
    hours: [22, 6]
    acoustic_weight_boost: 0.08
    mmwave_weight_boost: 0.05

permissions:
  agent_forbidden_final_approve:
    - alert.high_risk.dispatch
    - care_record.publish
    - meeting.todo.create_order
    - health.status.overwrite
  agent_may_read:
    - sensor.structured_events
    - elder.bed_context
    - care.snapshot
  agent_denied:
    - raw.video.stream
    - raw.audio.waveform

routing:
  high:
    channels: ["caregiver", "head_nurse", "wecom"]
  review:
    channels: ["review_queue"]
  night_sensitivity: high

voice_care:
  dedupe_window_seconds: 120
  similarity_threshold: 0.86
  max_history_snippets: 6

meeting:
  max_segment_tokens: 800
  merge_similarity: 0.82

feedback:
  min_negatives_to_tune: 5
  threshold_step: 0.02
  threshold_min: 0.35
  threshold_max: 0.90

health_auto:
  vitals_window_hours: 24
  alert_on_abnormal: true
