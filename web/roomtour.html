<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9f4">
  <meta name="description" content="可旋转、换房间的养老机构环境导览。">
  <title>3D 环境导览 · 养老机构</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/visit.css">
  <link rel="stylesheet" href="/roomtour.css">
  <script type="module" src="/roomtour.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到导览</a>
  <header class="site-header">
    <div class="site-wrap site-nav">
      <a class="site-brand" href="/visit"><img src="/assets/mark.svg" width="34" height="34" alt=""><strong data-tour-brand>养老机构</strong></a>
      <nav aria-label="导览导航"><a href="/visit">官网首页</a><a href="/visit#appointment">预约参观</a></nav>
      <button class="secondary visitor-entry" type="button" id="visitor-open">访客登录</button>
    </div>
  </header>
  <main id="main" class="site-wrap tour-workspace">
    <header class="tour-title">
      <div><h1>3D 环境导览</h1><p>示范场景供线上体验，实际环境请来院参观。</p></div>
      <a href="/visit#appointment" class="primary">预约实地参观</a>
    </header>
    <div class="tour-layout">
      <section class="tour-viewer" aria-labelledby="scene-name">
        <div class="tour-stage" id="tour-stage">
          <div class="tour-scene-info">
            <span id="scene-place"></span><h2 id="scene-name"></h2>
          </div>
          <canvas class="tour-canvas" id="tour-canvas" tabindex="0" aria-label="可旋转的三维场景" aria-describedby="tour-guide"></canvas>
          <div class="tour-hotspots" id="tour-hotspots"></div>
          <p class="tour-empty" id="tour-empty" hidden>此浏览器暂时无法绘制 3D 场景，仍可查看右侧的空间介绍。</p>
          <div class="tour-pad" aria-label="控制视角" role="group">
            <button type="button" data-tour-turn="left" aria-label="向左旋转" title="向左旋转">‹</button>
            <button type="button" data-tour-turn="right" aria-label="向右旋转" title="向右旋转">›</button>
            <button type="button" data-tour-turn="in" aria-label="放大" title="放大">＋</button>
            <button type="button" data-tour-turn="out" aria-label="缩小" title="缩小">−</button>
            <button type="button" data-tour-turn="reset">复位视角</button>
          </div>
        </div>
        <footer class="tour-viewer-footer">
          <p id="tour-guide">拖动旋转。键盘可用方向键旋转，按加号或减号缩放。</p>
          <span>3D 示范</span>
        </footer>
      </section>
      <aside class="tour-sidebar" aria-labelledby="tour-places">
        <h2 id="tour-places">选择参观空间</h2>
        <div class="tour-stops" id="tour-stops"></div>
        <section class="tour-current" aria-labelledby="tour-current-title">
          <h3 id="tour-current-title">场景介绍</h3><p id="scene-description" aria-live="polite"></p>
        </section>
      </aside>
    </div>
  </main>
  <dialog id="visitor-dialog" aria-labelledby="visitor-title">
    <div class="dialog-head"><h2 id="visitor-title">访客快捷登录</h2><button type="button" id="visitor-close" aria-label="关闭登录提示">×</button></div>
    <p class="visitor-intro">可以继续浏览，也可以验证手机，使用访客身份返回导览。</p>
    <p id="visitor-service" class="visitor-service" role="status"></p>
    <form id="visitor-phone-form" hidden>
      <label>中国大陆手机号<input name="phone" type="tel" inputmode="numeric" maxlength="18" required autocomplete="tel-national"></label>
      <label class="consent"><input name="consent" type="checkbox" required><span>我同意验证此号码，用于建立本次访客登录。</span></label>
      <button type="submit" class="primary">发送验证码</button>
    </form>
    <div id="visitor-demo" class="visitor-demo" hidden>
      <p>演示号码 <strong>13900000000</strong>，用于体验验证流程。</p>
      <button type="button" id="visitor-demo-fill" class="text-action">填入演示号码</button>
    </div>
    <form id="visitor-code-form" hidden>
      <label>短信验证码<input name="code" type="text" pattern="[0-9]{8}" maxlength="8" required inputmode="numeric" autocomplete="one-time-code"></label>
      <p class="visitor-demo" id="visitor-demo-code" hidden></p>
      <div class="visitor-actions"><button type="submit" class="primary">验证并登录</button><button id="visitor-restart" type="button" class="text-action">更换号码</button></div>
    </form>
    <p id="visitor-error" class="form-error" role="alert"></p>
    <div class="visitor-bottom">
      <button class="secondary" type="button" id="visitor-wechat" disabled>微信快捷登录暂未开通</button>
      <button class="secondary" type="button" id="visitor-continue">继续浏览</button>
      <a href="/visit#appointment">预约参观或请求回电</a>
    </div>
  </dialog>
</body>
</html>
