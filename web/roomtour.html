<!doctype html>
<html lang="zh-CN" class="visitor-site">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff"><meta name="description" content="在线体验四处可旋转的示范空间。">
  <title>3D 环境导览 · 医养服务</title><link rel="icon" href="/assets/desk-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/color-mode.css"><link rel="stylesheet" href="/visit.css"><link rel="stylesheet" href="/roomtour.css"><script type="module" src="/roomtour.js"></script>
</head><body><a class="skip-link" href="#main">跳到主要内容</a>
<header class="site-header"><div class="site-wrap site-nav"><a class="site-brand" href="/visit"><span class="brand-mark"><img src="/assets/desk-mark.svg" width="34" height="32" alt=""></span><strong data-brand>医养服务</strong></a>
      <nav aria-label="官网导航"><a href="/visit">机构首页</a><a href="/roomtour" aria-current="page">环境导览</a><a href="/visit#care">照护服务</a><a href="/faq">常见问题</a></nav>
      <div class="site-actions account-actions"><a class="staff-link" href="/?workspace=1">账号登录</a><a class="secondary" href="/visitor-register.html">免手机号注册</a></div>
    </div></header>  <main id="main" class="site-wrap tour-workspace">
    <header class="tour-title">
      <div><p class="visit-crumb"><a href="/visit">机构首页</a> / 环境导览</p><h1>3D 环境导览</h1><p>选择空间，拖动查看全景布局。场景为设计示意。</p></div>
      <a href="/visit#book-visit" class="primary">预约实地参观</a>
    </header>
    <div class="tour-layout">
      <section class="tour-viewer" aria-labelledby="scene-name">
        <div class="tour-stage" id="tour-stage">
          <div class="tour-scene-info">
            <span id="scene-place"></span><h2 id="scene-name"></h2>
          </div>
          <canvas class="tour-canvas" id="tour-canvas" tabindex="0" aria-label="可旋转的三维场景" aria-describedby="tour-guide"></canvas>
          <div class="tour-hotspots" id="tour-hotspots"></div>
          <p class="tour-empty" id="tour-empty" hidden>此浏览器暂时无法绘制 3D 场景，仍可选择空间并阅读介绍。</p>
          <div class="tour-pad" aria-label="控制视角" role="group">
            <button type="button" data-tour-turn="left" aria-label="向左旋转" title="向左旋转">‹</button>
            <button type="button" data-tour-turn="right" aria-label="向右旋转" title="向右旋转">›</button>
            <button type="button" data-tour-turn="in" aria-label="放大" title="放大">＋</button>
            <button type="button" data-tour-turn="out" aria-label="缩小" title="缩小">−</button>
            <button type="button" data-tour-turn="reset">复位视角</button>
          </div>
        </div>
        <footer class="tour-viewer-footer">
          <p id="tour-guide">拖动旋转。键盘可用方向键旋转，按加号或减号缩放。</p>

        </footer>
      </section>
      <aside class="tour-sidebar" aria-labelledby="tour-places">
        <h2 id="tour-places">参观路线</h2>
        <div class="tour-stops" id="tour-stops"></div>
        <section class="tour-current" aria-labelledby="tour-current-title">
          <h3 id="tour-current-title">场景介绍</h3><p id="scene-description" aria-live="polite"></p>
        </section>
      </aside>
    </div>
  </main>
<footer class="site-footer"><div class="site-wrap footer-layout"><a class="site-brand" href="/visit"><span class="brand-mark"><img src="/assets/desk-mark.svg" width="34" height="32" alt=""></span><strong data-brand>医养服务</strong></a>
      <nav aria-label="页脚导航"><a href="/roomtour">环境导览</a><a href="/visit#book-visit">预约来院</a><a href="/faq">常见问题</a><a href="/?workspace=1">账号登录</a></nav>
    </div></footer></body></html>
