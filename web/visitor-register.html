<!doctype html>
<html lang="zh-CN" class="visitor-site">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff"><meta name="description" content="使用用户名和密码注册访客服务，无需填写手机号。">
  <title>访客注册 · 医养服务</title><link rel="icon" href="/assets/desk-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/color-mode.css"><link rel="stylesheet" href="/visit.css"><script type="module" src="/visitor-register.js"></script>
</head><body><a class="skip-link" href="#main">跳到主要内容</a>
<header class="site-header"><div class="site-wrap site-nav"><a class="site-brand" href="/visit"><span class="brand-mark"><img src="/assets/desk-mark.svg" width="34" height="32" alt=""></span><strong data-brand>医养服务</strong></a>
      <nav aria-label="官网导航"><a href="/visit">机构首页</a><a href="/roomtour">环境导览</a><a href="/visit#care">照护服务</a><a href="/faq">常见问题</a></nav>
      <div class="site-actions account-actions"><a class="staff-link" href="/?workspace=1">账号登录</a></div>
    </div></header>
<main id="main" class="site-wrap register-page">
  <aside class="register-window"><img src="/assets/visit/lounge.webp" width="1536" height="1024" alt="适老公共起居空间设计示意"><div><h2>先了解环境，<br>再安排到院。</h2><a class="hero-book" href="/roomtour">匿名参观 3D 空间</a></div><small>公共起居区 · 设计示意</small></aside>
  <section class="form-card" aria-labelledby="register-title"><p class="visit-crumb"><a href="/visit">机构首页</a> / 访客服务</p>
    <h1 id="register-title">注册访客账号</h1><p>只需设置登录名和密码，免填手机号。</p>
      <form id="visitor-register" method="post">
        <label>登录名<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="40" aria-describedby="username-help"></label>
        <small id="username-help">3–40 位，以字母或数字开头，可使用点、下划线和短横线。</small>
        <label>密码<input name="password" type="password" autocomplete="new-password" required aria-describedby="password-help"></label>
        <small id="password-help">请设置 10–128 个字符，并保存好您的登录名和密码。</small>
        <p class="form-error" role="alert" id="register-error"></p>
        <button type="submit" class="primary" disabled>注册并进入访客服务</button>
        <noscript>请启用 JavaScript 完成注册。</noscript>
      </form>
      <p>已有账号？<a href="/?workspace=1">直接登录</a></p>
</section></main><footer class="site-footer"><div class="site-wrap footer-layout"><a class="site-brand" href="/visit"><span class="brand-mark"><img src="/assets/desk-mark.svg" width="34" height="32" alt=""></span><strong data-brand>医养服务</strong></a>

    </div></footer></body></html>
